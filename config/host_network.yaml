# Network settings for the Windows control computer and Quest 3.
host_network:
  # Optional manual fallback only. Automatic discovery does not need this IP.
  local_ip: "192.168.89.66"

  # Keep 0.0.0.0 to receive packets on all computer network adapters.
  listen_ip: "0.0.0.0"
  listen_port: 5005

  # Quest broadcasts discovery requests on this port.
  discovery_enabled: true
  discovery_port: 5006

  # Always open camera previews on the monitor attached to the robot host.
  # This also applies when the command is launched from an SSH terminal.
  preview_target: "host"
  host_desktop_display: ":1"
  # Leave empty to use /run/user/<uid>/gdm/Xauthority automatically.
  host_xauthority: ""
