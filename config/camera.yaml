camera:
  name: "top"
  enabled: true
  # Stop teleoperation if the visual stream cannot be started or is lost.
  required: true
  # Top camera: Intel RealSense D405, bound by stable hardware serial.
  driver: "realsense"
  device: ""
  serial: "260322270720"
  # Match the wrist stream for aligned dual-camera training data.
  width: 640
  height: 480
  fps: 30
  fourcc: ""
  enable_depth: false
  # Base configuration value. The VR and master collection launchers enable
  # both preview windows by default; pass --no-camera-preview to hide them.
  preview: false
  startup_timeout_s: 8.0
  frame_timeout_ms: 1000
  max_consecutive_timeouts: 5

# Both RealSense cameras are recorded and previewed under stable top/wrist names.
cameras:
  wrist:
    name: "wrist"
    enabled: true
    required: true
    driver: "realsense"
    # Wrist camera: Intel RealSense D405, bound by stable hardware serial.
    # The /dev/video* indices are not stable and therefore are intentionally unused.
    device: ""
    serial: "230422270800"
    # Match the primary collection stream for consistent dual-camera preview.
    width: 640
    height: 480
    fps: 30
    fourcc: ""
    enable_depth: false
    preview: false
    startup_timeout_s: 12.0
    frame_timeout_ms: 3000
    max_consecutive_timeouts: 3
